{{define "content"}}
<div class="py-6 sm:py-12 flex justify-center">
  <div class="w-full max-w-xl p-8 sm:p-10 rounded-3xl bg-slate-900/80 border border-slate-800/90 backdrop-blur-xl shadow-2xl shadow-orange-500/5 relative overflow-hidden">
    <!-- Accent glow -->
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-orange-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="text-center mb-8 relative z-10">
      <div class="inline-flex w-12 h-12 rounded-2xl bg-orange-500/10 border border-orange-500/20 text-orange-400 items-center justify-center text-xl mb-3 shadow-inner">
        ✉️
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Contacto</h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-1 font-medium">¿Tienes alguna pregunta o sugerencia? Escríbenos directamente.</p>
    </div>

    <div class="success-message hidden mb-4 p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold text-center">
      Thank you for your message! We'll get back to you soon.
    </div>

    <div class="error-message hidden mb-4 p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold text-center">
      xxx
    </div>

    <form action="/contact" method="post" class="space-y-4 relative z-10">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label for="name" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Nombre</label>
          <input type="text" id="name" name="name" value="" placeholder="Tu nombre" required
            class="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all">
        </div>

        <div class="space-y-1.5">
          <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Correo Electrónico</label>
          <input type="email" id="email" name="email" value="" placeholder="tu@email.com" required
            class="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all">
        </div>
      </div>

      <div class="space-y-1.5">
        <label for="subject" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Asunto</label>
        <input type="text" id="subject" name="subject" value="" placeholder="¿De qué trata tu mensaje?" required
          class="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all">
      </div>

      <div class="space-y-1.5">
        <label for="message" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Mensaje</label>
        <textarea id="message" name="message" rows="4" placeholder="Escribe tu mensaje aquí..." required
          class="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all resize-none"></textarea>
      </div>

      <button type="submit"
        class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-bold text-sm shadow-lg shadow-orange-500/25 active:scale-[0.98] transition-all mt-2">
        Enviar Mensaje
      </button>
    </form>
  </div>
</div>
{{end}}
