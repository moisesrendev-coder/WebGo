<form action="/" method="GET" class="p-4 rounded-2xl bg-slate-900/60 border border-slate-800/80 backdrop-blur-md shadow-xl shadow-black/10 hover:border-slate-800 transition-all">
  <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
    
    <!-- Search Input -->
    <div class="relative flex-1">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <input 
        type="text" 
        name="q" 
        value="{{if .Filter}}{{.Filter.Query}}{{end}}" 
        placeholder="Buscar publicaciones por título..." 
        class="w-full pl-10 pr-9 py-2 bg-slate-950/80 border border-slate-800 rounded-xl text-xs sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-orange-500/60 focus:ring-2 focus:ring-orange-500/20 transition-all"
      />
      {{if and .Filter .Filter.Query}}
      <a href="/" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-orange-400 transition-colors" title="Limpiar búsqueda">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </a>
      {{end}}
    </div>

    <!-- Right Section: Limit & Submit -->
    <div class="flex items-center gap-2.5 shrink-0 justify-between sm:justify-start">
      <div class="flex items-center gap-2">
        <label for="page_size" class="text-xs font-semibold text-slate-400 whitespace-nowrap">Mostrar:</label>
        <div class="relative">
          <select 
            id="page_size" 
            name="page_size" 
            onchange="this.form.submit()"
            class="appearance-none bg-slate-950/80 border border-slate-800 text-slate-200 text-xs font-bold py-2 pl-3 pr-8 rounded-xl focus:outline-none focus:border-orange-500/60 focus:ring-2 focus:ring-orange-500/20 transition-all cursor-pointer hover:border-slate-700"
          >
            <option value="10" {{if eq .Metadata.PageSize 10}}selected{{end}}>10 posts</option>
            <option value="25" {{if eq .Metadata.PageSize 25}}selected{{end}}>25 posts</option>
            <option value="50" {{if eq .Metadata.PageSize 50}}selected{{end}}>50 posts</option>
            <option value="100" {{if eq .Metadata.PageSize 100}}selected{{end}}>100 posts</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
        </div>
      </div>

      <button 
        type="submit" 
        class="px-4 py-2 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 active:scale-95 shadow-md shadow-orange-500/20 transition-all flex items-center gap-1.5"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
        </svg>
        Filtrar
      </button>
    </div>

  </div>
</form>
