{{define "content"}}
<div class="py-6 sm:py-12 flex justify-center">
  <div class="w-full max-w-md p-8 rounded-3xl bg-slate-900/80 border border-slate-800/90 backdrop-blur-xl shadow-2xl shadow-orange-500/5 relative overflow-hidden">
    <!-- Accent glow -->
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-orange-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="text-center mb-8 relative z-10">
      <div class="inline-flex w-12 h-12 rounded-2xl bg-orange-500/10 border border-orange-500/20 text-orange-400 items-center justify-center text-xl mb-3 shadow-inner">
        📝
      </div>
      <h2 class="text-2xl font-extrabold tracking-tight text-white">Publicar un Enlace</h2>
      <p class="text-xs text-slate-400 mt-1 font-medium">Comparte contenido interesante con la comunidad</p>
    </div>

    <div class="error-message hidden mb-4 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold text-center">
    </div>

    <form action="/submit" method="post" autocomplete="off" class="space-y-5 relative z-10">
      <div class="space-y-1.5">
        <label for="title" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Título de la Publicación</label>
        <input type="text" id="title" name="title" value="" placeholder="Ej. Show HN: Mi nuevo proyecto en Go" required
          class="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all">
        <p class="inline-error text-xs text-rose-400 mt-1 font-medium"></p>
      </div>

      <div class="space-y-1.5">
        <label for="url" class="block text-xs font-bold uppercase tracking-wider text-slate-300">URL del Enlace</label>
        <input type="url" id="url" name="url" value="" placeholder="https://github.com/..." required
          class="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all">
        <p class="inline-error text-xs text-rose-400 mt-1 font-medium"></p>
      </div>

      <button type="submit"
        class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-bold text-sm shadow-lg shadow-orange-500/25 active:scale-[0.98] transition-all">
        Enviar Publicación
      </button>
    </form>
  </div>
</div>
{{end}}
